[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
remote_tmp = /tmp/.ansible/tmp
host_key_checking = False
timeout = 30
# OpenWrt Dropbear does not support ControlPersist
forks = 5
retry_files_enabled = False

[ssh_connection]
# SCP is more compatible with OpenWrt's Dropbear SSH than SFTP
scp_if_ssh = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
# Dropbear does not support ControlPersist; disable pipelining
pipelining = False
