---
# Inventory for the OpenWrt multi-WAN edge router deployment.
# The target is a Celeron mining board repurposed as a bare-metal x86
# OpenWrt router with dual WAN (VDSL + 4G).
all:
  children:
    openwrt_routers:
      hosts:
        mining-board:
          ansible_host: 192.168.1.1
          ansible_user: root
          ansible_connection: ssh
          # OpenWrt ships BusyBox ash; install python3 or use raw/shell
          # modules.  If only micropython is available, override per-host.
          ansible_python_interpreter: /usr/bin/python3
