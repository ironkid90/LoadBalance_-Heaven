---
# proxy_gost – download, install, and configure GOST SOCKS5 proxy
# All tasks gated on gost_enabled to allow opt-out.

- name: Download GOST binary
  ansible.builtin.get_url:
    url: "https://github.com/ginuerzh/gost/releases/download/v{{ gost_version }}/gost-{{ gost_arch }}-{{ gost_version }}.gz"
    dest: /tmp/gost.gz
    mode: "0644"
  when: gost_enabled | default(false)
  tags: [gost]

- name: Decompress GOST binary
  ansible.builtin.shell: |
    gunzip -f /tmp/gost.gz
    mv /tmp/gost /usr/local/bin/gost
    chmod 0755 /usr/local/bin/gost
  when: gost_enabled | default(false)
  tags: [gost]

- name: Create GOST procd init script
  ansible.builtin.copy:
    dest: /etc/init.d/gost
    mode: "0755"
    content: |
      #!/bin/sh /etc/rc.common
      # GOST SOCKS5 proxy – round-robin across VDSL + 4G WANs
      START=99
      STOP=10
      USE_PROCD=1

      start_service() {
          procd_open_instance
          # -L  = local SOCKS5 listener
          # -F  = forward chain with interface binding via IP route hints
          # strategy=round uses round-robin across the two forward nodes
          procd_set_param command /usr/local/bin/gost \
              -L "socks5://:{{ gost_listen_port }}" \
              -F "socks5://:0?interface={{ macvlan_pppoe_if }}&strategy=round" \
              -F "socks5://:0?interface={{ wan_4g_if }}&strategy=round"
          procd_set_param respawn 3600 5 5
          procd_set_param stdout 1
          procd_set_param stderr 1
          procd_close_instance
      }
  when: gost_enabled | default(false)
  notify: restart gost
  tags: [gost]

- name: Enable GOST service
  ansible.builtin.shell: /etc/init.d/gost enable
  changed_when: false
  when: gost_enabled | default(false)
  tags: [gost]

- name: Start GOST service
  ansible.builtin.shell: /etc/init.d/gost start
  changed_when: false
  when: gost_enabled | default(false)
  tags: [gost]
