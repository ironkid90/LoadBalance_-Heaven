---
# interfaces_macvlan – MACVLAN device, PPPoE WAN, 4G WAN, LAN via UCI

# ---------- MACVLAN device (veth1 from eth0) ----------
- name: Create MACVLAN device definition
  ansible.builtin.shell: |
    uci set network.macvlan_dev=device
    uci set network.macvlan_dev.type='macvlan'
    uci set network.macvlan_dev.name='{{ macvlan_pppoe_if }}'
    uci set network.macvlan_dev.ifname='{{ wan_vdsl_if }}'
    uci set network.macvlan_dev.mode='bridge'
  notify: commit and restart network
  tags: [network, macvlan]

# ---------- PPPoE WAN over MACVLAN ----------
- name: Configure PPPoE WAN interface
  ansible.builtin.shell: |
    uci set network.wan=interface
    uci set network.wan.proto='pppoe'
    uci set network.wan.device='{{ macvlan_pppoe_if }}'
    uci set network.wan.username='{{ pppoe_username }}'
    uci set network.wan.password='{{ pppoe_password }}'
    uci set network.wan.mtu='{{ pppoe_mtu }}'
    uci set network.wan.mru='{{ pppoe_mru }}'
    uci set network.wan.ipv6='auto'
    uci set network.wan.keepalive='5 3'
  notify: commit and restart network
  tags: [network, pppoe]

# ---------- 4G / USB WAN ----------
- name: Configure 4G USB WAN interface (DHCP)
  ansible.builtin.shell: |
    uci set network.wan2=interface
    uci set network.wan2.proto='dhcp'
    uci set network.wan2.device='{{ wan_4g_if }}'
    uci set network.wan2.metric='20'
  notify: commit and restart network
  tags: [network, 4g]

# ---------- LAN ----------
- name: Configure LAN interface
  ansible.builtin.shell: |
    uci set network.lan=interface
    uci set network.lan.proto='static'
    uci set network.lan.device='br-lan'
    uci set network.lan.ipaddr='{{ lan_ipaddr }}'
    uci set network.lan.netmask='{{ lan_netmask }}'
  notify: commit and restart network
  tags: [network, lan]
